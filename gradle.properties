org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Lint checks bundled with Compose BOM 2023.10.01 crash under K2 UAST, so lint analyzes with K1 UAST.
# Remove this once the Compose BOM is upgraded to one whose lint checks support K2 UAST.
android.lint.useK2Uast=false
